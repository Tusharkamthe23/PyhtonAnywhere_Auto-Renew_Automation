
name: PythonAnywhere Auto-Renew

on:
  schedule:
    # 09:30 AM India time on the 1st and 15th
    - cron: "0 4 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pythonanywhere-renewal
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check and renew web app
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_PASSWORD: ${{ secrets.PA_PASSWORD }}
        run: python renew.py
